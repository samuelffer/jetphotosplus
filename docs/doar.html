<script>
// ===== I18N SYSTEM (mesmo esquema da index; mesma chave de idioma) =====
(() => {
  const STORAGE_KEY = 'jetphotosplus_lang';

  const translations = {
    en: {
      brandHome: 'JetPhotos+ home',
      githubView: 'View on GitHub',
      donateTitle: 'Support JetPhotos<span>+</span>',
      donateDescription: 'JetPhotos+ is free and built in spare time. If it helps you every day, consider supporting it with any amount — every donation keeps the project alive.',
      donatePaypalHint: 'Open donation page',
      donatePaypalCard: 'Donate via PayPal (opens in a new tab)',
      donatePixHint: 'Copy Pix key',
      donatePixCard: 'Copy the Pix key to donate',
      donatePixCopied: 'Pix key copied!',
      donatePixFailed: 'Could not copy the key.',
      backHome: 'Home',
      footerDisclaimer: 'Unofficial community extension · Not affiliated with JetPhotos'
    },
    pt: {
      brandHome: 'Página inicial do JetPhotos+',
      githubView: 'Ver no GitHub',
      donateTitle: 'Apoie o JetPhotos<span>+</span>',
      donateDescription: 'O JetPhotos+ é gratuito e feito nas horas vagas. Se ele te ajuda no dia a dia, considere apoiar com qualquer valor — cada doação mantém o projeto vivo.',
      donatePaypalHint: 'Abrir página de doação',
      donatePaypalCard: 'Doar via PayPal (abre em nova aba)',
      donatePixHint: 'Copiar chave Pix',
      donatePixCard: 'Copiar a chave Pix para doar',
      donatePixCopied: 'Chave Pix copiada!',
      donatePixFailed: 'Não foi possível copiar a chave.',
      backHome: 'Início',
      footerDisclaimer: 'Extensão comunitária não oficial · Não afiliada ao JetPhotos'
    }
  };

  function getBrowserLanguage() {
    const languages = Array.isArray(navigator.languages) && navigator.languages.length
      ? navigator.languages
      : [navigator.language || 'en'];
    return languages.some(lang => String(lang).toLowerCase().startsWith('pt')) ? 'pt' : 'en';
  }

  function getSavedLanguage() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved === 'pt' || saved === 'en' ? saved : null;
    } catch (error) {
      console.warn('JetPhotos+ i18n: unable to read saved language preference.', error);
      return null;
    }
  }

  function getInitialLanguage() {
    return getSavedLanguage() || getBrowserLanguage();
  }

  function saveLanguagePreference(lang) {
    try {
      localStorage.setItem(STORAGE_KEY, lang);
      return localStorage.getItem(STORAGE_KEY) === lang;
    } catch (error) {
      console.warn('JetPhotos+ i18n: unable to save language preference.', error);
      return false;
    }
  }

  function applyLanguage(lang, persist = false) {
    const active = translations[lang] ? lang : 'en';

    document.documentElement.lang = active === 'pt' ? 'pt-BR' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(element => {
      const key = element.dataset.i18n;
      if (translations[active][key] !== undefined) element.textContent = translations[active][key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(element => {
      const key = element.dataset.i18nHtml;
      if (translations[active][key] !== undefined) element.innerHTML = translations[active][key];
    });
    document.querySelectorAll('[data-i18n-attr]').forEach(element => {
      element.dataset.i18nAttr.split('|').forEach(pair => {
        const [attribute, key] = pair.split(':');
        if (attribute && key && translations[active][key] !== undefined) {
          element.setAttribute(attribute, translations[active][key]);
        }
      });
    });

    const languageToggle = document.getElementById('languageToggle');
    if (languageToggle) {
      languageToggle.style.opacity = '0.35';
      languageToggle.textContent = active === 'pt' ? 'PT' : 'EN';
      languageToggle.setAttribute('aria-label', active === 'pt' ? 'Switch to English' : 'Mudar para português');
      languageToggle.setAttribute('title', active === 'pt' ? 'Switch to English' : 'Mudar para português');
      requestAnimationFrame(() => { languageToggle.style.opacity = '1'; });
    }

    document.title = active === 'pt' ? 'Doar — JetPhotos+' : 'Donate — JetPhotos+';
    const description = document.querySelector('meta[name="description"]');
    if (description) {
      description.content = active === 'pt'
        ? 'Apoie o JetPhotos+ — extensão comunitária gratuita. Doe via PayPal ou Pix.'
        : 'Support JetPhotos+ — a free, unofficial community extension. Donate via PayPal or Pix.';
    }

    window.JPP_LANG = active;
    window.JPP_TRANSLATIONS = translations;

    if (persist) {
      const saved = saveLanguagePreference(active);
      if (!saved) console.warn('JetPhotos+ i18n: language preference could not be persisted.');
    }

    window.dispatchEvent(new CustomEvent('jpp:languagechange', { detail: { lang: active } }));
  }

  const languageToggle = document.getElementById('languageToggle');
  if (languageToggle) {
    languageToggle.addEventListener('click', () => {
      const nextLanguage = window.JPP_LANG === 'pt' ? 'en' : 'pt';
      applyLanguage(nextLanguage, true);
    });
  }

  applyLanguage(getInitialLanguage(), false);
})();
</script>

<script>
// ===== Doação: destinos =====
const PAYPAL_URL = 'https://www.paypal.com/donate/?business=2SB4XYNBF53RC&no_recurring=1&item_name=Extens%C3%A3o+JetPhotos%2B&currency_code=BRL';
// TODO: trocar pela chave Pix definitiva quando ela existir.
const PIX_KEY = 'SUA-CHAVE-PIX-AQUI';

document.getElementById('paypalCard').href = PAYPAL_URL;
// Ícones dos métodos via hotlink (mesmo esquema dos ícones de navegador da
// index: pra trocar um dia, basta trocar a URL aqui).
const DONATE_ICON_URLS = {
  paypal: 'https://cdn-icons-png.flaticon.com/512/174/174861.png',
  pix: 'https://blog.caviarcriativo.com/wp-content/uploads/2025/03/Download-Logo-Pix.png'
};
Object.entries(DONATE_ICON_URLS).forEach(([name, url]) => {
  const img = document.getElementById(`icon-${name}`);
  if (!img) return;
  // Hotlink pode quebrar: em vez de ícone quebrado, mostra o nome em texto.
  img.addEventListener('error', () => {
    const fallback = document.createElement('span');
    fallback.className = 'donate-fallback';
    fallback.textContent = name === 'pix' ? 'Pix' : 'PayPal';
    img.replaceWith(fallback);
  }, { once: true });
  img.src = url;
});

// Copia com fallback: a Clipboard API pode não existir/ser negada (ex.:
// contexto não seguro), então tenta o textarea + execCommand antes de
// desistir — o toast de erro só aparece se os dois falharem.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (error) {
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    } catch (fallbackError) {
      return false;
    }
  }
}

let toastTimer = null;
function showToast(message, isError) {
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = message;
  toast.classList.toggle('error', !!isError);
  // Re-dispara a transição quando o usuário clica várias vezes seguidas.
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

document.getElementById('pixCard').addEventListener('click', async () => {
  const lang = window.JPP_LANG === 'pt' ? 'pt' : 'en';
  const t = (window.JPP_TRANSLATIONS && window.JPP_TRANSLATIONS[lang]) || {};
  const ok = await copyText(PIX_KEY);
  showToast(ok ? (t.donatePixCopied || 'OK') : (t.donatePixFailed || 'Error'), !ok);
});
</script>

<script src="assets/photos.js"></script>
<script>
// Mesmo fundo rotativo da index (as fotos ficam atrás do cartão de vidro).
const photoLayers = [
  document.querySelector('.photo-layer-a'),
  document.querySelector('.photo-layer-b')
];

function initPhotoBackground() {
  const photos = Array.isArray(window.JPP_PHOTOS) ? window.JPP_PHOTOS : [];
  if (!photos.length) return;

  let deck = [];
  let activeLayer = 0;
  let previous = null;

  function refillDeck() {
    deck = [...photos];
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    if (deck.length > 1 && deck[0] === previous) [deck[0], deck[1]] = [deck[1], deck[0]];
  }

  function nextPhoto() {
    if (!deck.length) refillDeck();
    const photo = deck.shift();
    if (!photo) return;
    previous = photo;
    const nextLayer = 1 - activeLayer;
    const layer = photoLayers[nextLayer];
    layer.style.backgroundImage = `url("${encodeURI(photo)}")`;
    layer.classList.add('is-visible');
    photoLayers[activeLayer].classList.remove('is-visible');
    activeLayer = nextLayer;
  }

  photoLayers[activeLayer].style.backgroundImage = `url("${encodeURI(photos[0])}")`;
  previous = photos[0];
  photoLayers[activeLayer].classList.add('is-visible');
  deck = photos.filter(photo => photo !== previous);

  const PHOTO_DURATION_MS = 8500;
  function scheduleNext() {
    setTimeout(() => {
      nextPhoto();
      scheduleNext();
    }, PHOTO_DURATION_MS);
  }
  scheduleNext();
}

initPhotoBackground();
</script>
